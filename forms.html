<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="forms.css">
    <link rel="stylesheet" href="header.css">
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.7/build/css/intlTelInput.css"
/>
</head>
<body>
     <header>
      <div class="form_logo">
        <a href="index.html">Registration Form</a>
      </div>
      <nav class="form_menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Sign in</a></li>
        </ul>
      </nav> 

</div>
    </header>
    <form class="signup" action="">
        <div class="row">

<label>Full Name:</label>
<i class="fa fa-user"></i>
    <input type="text" id="name" name="name" placeholder="Enter your Name" required>
    <small id="fullnameError"></small>
        </div>
    <div class="row">
<label>Gender:</label>
 <i id="icon_gender" class="fa fa-transgender"></i>  
<select name="gender" id="gender">
  <option value="select gender" selected>Select Gender</option>
  <option value="Male" >Male</option> <!-- Male is now default -->
  <option value="Female">Female</option>
</select>
<small id="Gendererror"></small>
    </div>

    <div class="row">
 <label>Email:</label>
 <i class="fa-solid fa-envelope"></i>
    <input type="text" id="email" name="email"  placeholder="email@gmail.com">
    <small id="emailerror"></small>
    </div>
<div class="row">
        <label>Mobile:</label> 
    <input  type="tel" onblur="check_phone_number()"  class="Phone" id="phone" name="phone">
    <small id="NumberError"></small>
    </div>
    
    <div class="row">
        <label>Enter New password:</label>
        <i class="fa fa-key" aria-hidden="true"></i>
    <input  type="password"  class="password" id="password" name="password">
    <small id="PasswordError"></small>
    </div>
    <div class="row">
    <label>Confirm password:</label>
    <i class="fa fa-key" aria-hidden="true"></i>
    <input  type="password"  class="cpassword" id="cpassword" name="cpassword">
    <small id="cPasswordError"></small>
    </div>
<div style="justify-content: center; align-items: center; text-align: center;" >
    <a href="#" class="btn" onclick="submitForm()"><i class="fa-solid fa-envelope"></i>Submit</a>

</div>
        

    </form>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.7/build/js/intlTelInput.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.7/build/js/utils.js"></script>
    <script src="form.js"></script>
</body>
</html>
